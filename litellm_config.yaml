## Model profiles the harness talks to. Profile names (model_name) are the
## contract — the harness, .env.example, and the UI picker all use them.
## The provider model ids below are sensible defaults; adjust them to the
## models your keys can access without touching anything else.
model_list:
  - model_name: local-gemma
    litellm_params:
      model: ollama_chat/gemma3
      api_base: http://host.docker.internal:11434
  - model_name: claude
    litellm_params:
      model: anthropic/claude-sonnet-4-5
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: gpt
    litellm_params:
      model: openai/gpt-5.2
      api_key: os.environ/OPENAI_API_KEY
  - model_name: gemini-flash
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY

litellm_settings:
  drop_params: true          # tolerate provider-specific params gracefully

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/LITELLM_DATABASE_URL

[project]
name = "agent-harness"
version = "0.1.0"
description = "Production AI agent harness with swappable model/memory backends"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "openai[local]>=1.54",
    "azure-identity>=1.19",
    "cryptography>=50.0.0",
    "pgvector>=0.3",
    "psycopg[binary]>=3.2",
    "langgraph>=1.2.2",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "markitdown[docx,pdf,pptx,xlsx]>=0.1.6",
    "pymilvus[milvus-lite]>=3.0.0",
    "pyyaml>=6.0.3",
    "langfuse>=4.14.4",
    "langchain>=1.3.15",
    "python-dotenv>=1.2.2",
    # Transitive deps pinned above the vulnerable versions the resolver
    # would otherwise pick (see `docker scout cves`) — not organic feature
    # deps of this project.
    "starlette>=1.3.1",
    "msgpack>=1.2.1",
    "langsmith>=0.8.18",
    "setuptools>=78.1.1",
    "slowapi>=0.1.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
 "pytest-asyncio>=0.24",
 "ruff>=0.7",
 "mypy>=1.13",
 "fpdf2>=2.8.7",
]
# Docling runs ONLY inside the Linux ingest container (Dockerfile.ingest) —
# torch + onnxruntime crash via libomp on macOS. See
# harness/adapters/parsing/docling_parser.py.
# torch/torchvision are listed explicitly here (docling would pull them in
# transitively anyway) because uv's [tool.uv.sources] index override below
# only takes effect for a package that is a DIRECT dependency somewhere in
# this project's own pyproject.toml — a purely transitive requirement (as
# docling->torch would otherwise be) silently ignores the source pin and
# resolves the default PyPI wheel (which drags in ~2GB of CUDA packages on
# Linux). Verified empirically: see task-9-report.md.
docling = ["docling>=2.123,<3", "torch", "torchvision"]

[tool.uv.sources]
# CPU-only torch/torchvision: docling's PDF pipeline never needs CUDA, and the
# default GPU wheels add ~2GB to the ingest image for nothing. Secondary
# optimization only — see Dockerfile.ingest / task-9-report.md if this needs
# to fall back to the default index for a given build architecture.
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "unit: fast, isolated unit tests",
]

[tool.ruff]
line-length = 90
src = ["src"]

[tool.mypy]
mypy_path = "src"
packages = ["harness"]
# Relaxed for now: the existing scaffold carries pre-existing type debt
# (bare generics, an untyped eval helper, optional deps without stubs).
# Tighten back toward strict in a dedicated cleanup pass later.
check_untyped_defs = true
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx2>=2.0.0",
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.15",
]

[tool.hatch.build.targets.wheel]
packages = ["src/harness"]

services:
  api:
    build: { context: ., dockerfile: src/harness/api/Dockerfile }
    env_file: .env
    command: ["uvicorn", "harness.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--app-dir", "src", "--proxy-headers", "--forwarded-allow-ips=172.28.0.0/24"]
    depends_on: [postgres]
  caddy:
    build: { context: ., dockerfile: Dockerfile.caddy }
    ports: ["8000:8000"]
    env_file: .env
    depends_on: [api]
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: harness
      POSTGRES_PASSWORD: harness
      POSTGRES_DB: harness
    ports: ["5432:5432"]
    volumes:
      - "postgres_data:/var/lib/postgresql/data"
      - "./scripts/create-databases.sql:/docker-entrypoint-initdb.d/create-databases.sql"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harness"]
      interval: 3s
      timeout: 3s
      retries: 10

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    ports: ["4000:4000"]
    env_file: .env
    environment:
      LITELLM_DATABASE_URL: postgresql://harness:harness@postgres:5432/litellm
      STORE_MODEL_IN_DB: "false"
    volumes:
      - "./litellm_config.yaml:/app/config.yaml"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      # image ships neither wget nor curl; python3 is the only HTTP-capable tool present.
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Langfuse (+ ClickHouse/Redis/MinIO it depends on) removed for now — the
  # official ClickHouse image hits a first-boot bootstrap race on this
  # machine (see docs/devlog/009). Tracing is optional by design (blank
  # LANGFUSE_* keys already make the harness no-op it); this just stops
  # `make up` from trying to start the analytics stack at all. Restore from
  # git history when revisiting.

  # ollama:                      # runs natively on the host (menu-bar app);
  #   image: ollama/ollama:latest  # uncomment only if you prefer containerized
  #   ports: ["11434:11434"]
  #   volumes: ["ollama_data:/root/.ollama"]

volumes:
  postgres_data:
  # ollama_data:

# Fixed subnet so api's --forwarded-allow-ips can trust caddy's address
# without depending on Compose's auto-assigned default subnet. Trusting the
# whole subnet is safe specifically because api no longer publishes a host
# port — only fellow containers on this network can reach it at all.
networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/24

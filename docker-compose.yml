services:
  api:
    build: { context: ., dockerfile: src/harness/api/Dockerfile }
    ports: ["8000:8000"]
    env_file: .env
    depends_on: [postgres]
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: harness
      POSTGRES_PASSWORD: harness
      POSTGRES_DB: harness
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
  # ollama:                      # uncomment for the local Gemma-4 path
  #   image: ollama/ollama:latest
  #   ports: ["11434:11434"]
  #   volumes: ["ollama_data:/root/.ollama"]
volumes:
  postgres_data:
  # ollama_data:

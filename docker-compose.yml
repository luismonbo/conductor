services:
  # Offline RAG ingestion — separate image from the API's (docling drags in
  # torch/transformers/opencv; the served API never needs any of that).
  # profiles: ["ingest"] keeps it out of `make up`/`docker compose up`;
  # invoke via `make ingest COLLECTION=papers` or the profile flag directly.
  ingest:
    build: { context: ., dockerfile: Dockerfile.ingest }
    profiles: ["ingest"]
    env_file: .env
    environment:
      # .env's HARNESS_PGVECTOR_URL points at localhost, correct for a
      # host-run process reaching postgres via its published port. Inside
      # this container, postgres is a sibling reachable only by its
      # Compose service name — same reason litellm overrides its DSN below.
      HARNESS_PGVECTOR_URL: postgresql://harness:harness@postgres:5432/harness
    volumes:
      - "./data:/app/data"    # raw docs in, manifests + HF model cache out
      # Test code isn't baked into the image (tests/ is .dockerignored so
      # code-only changes don't bust the dependency-install layer cache) —
      # bind-mounted only so the container-gated integration test
      # (tests/integration/test_docling_parser_integration.py) can run
      # against this same image via `--entrypoint pytest` without a second
      # test-only image.
      - "./tests:/app/tests"
    depends_on: [postgres]

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: harness
      POSTGRES_PASSWORD: harness
      POSTGRES_DB: harness
    ports: ["5432:5432"]
    volumes:
      - "postgres_data:/var/lib/postgresql/data"
      - "./scripts/infra/create-databases.sql:/docker-entrypoint-initdb.d/create-databases.sql"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harness"]
      interval: 3s
      timeout: 3s
      retries: 10

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    ports: ["4000:4000"]
    env_file: .env
    environment:
      LITELLM_DATABASE_URL: postgresql://harness:harness@postgres:5432/litellm
      STORE_MODEL_IN_DB: "false"
    volumes:
      - "./litellm_config.yaml:/app/config.yaml"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      # image ships neither wget nor curl; python3 is the only HTTP-capable tool present.
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ollama:                      # runs natively on the host (menu-bar app);
  #   image: ollama/ollama:latest  # uncomment only if you prefer containerized
  #   ports: ["11434:11434"]
  #   volumes: ["ollama_data:/root/.ollama"]

volumes:
  postgres_data:
  # ollama_data:
